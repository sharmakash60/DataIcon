[project]
name = "datapilot-backend"
version = "0.1.0"
description = "DataPilot control-plane foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.2,<8",
  "pyjwt>=2.15.0",
  "bcrypt>=5.0.0",
  "email-validator>=2.3.0",
  "numpy>=2.5.3",
  "scikit-learn>=1.9.1",
  "optuna>=5.0.0",
  "xgboost>=3.4.1",
  "lightgbm>=4.7.0",
  "catboost>=1.2.10",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]
markers = ["integration: requires live PostgreSQL and Redis"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
