<svg width="240" height="220" viewBox="0 0 240 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="di-shadow-full" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.5" dy="2" stdDeviation="1" floodColor="#4a6348" floodOpacity="0.45" />
    </filter>
    <linearGradient id="di-facet-top-full" x1="120" y1="18" x2="120" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8da98b" />
      <stop offset="100%" stopColor="#829F80" />
    </linearGradient>
    <linearGradient id="di-facet-bottom-full" x1="120" y1="72" x2="120" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#b6cca4" />
      <stop offset="100%" stopColor="#a3bfa0" />
    </linearGradient>
  </defs>

  <!-- Emblem Centered at x=120 -->
  <g transform="translate(55, 0)">
    <!-- Back Segment of Upper Orbital Ring -->
    <path
      d="M 24 44 C 18 36 28 26 65 26 C 102 26 112 36 106 44"
      stroke="#adc4ab"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
      opacity="0.85"
    />

    <!-- Back Segment of Lower Orbital Ring -->
    <path
      d="M 24 64 C 18 56 28 46 65 46 C 102 46 112 56 106 64"
      stroke="#adc4ab"
      stroke-width="6"
      stroke-linecap="round"
      fill="none"
      opacity="0.85"
    />

    <!-- Central Shield: Lower Facet -->
    <path
      d="M 28 70 L 65 83 L 102 70 L 65 116 Z"
      fill="url(#di-facet-bottom-full)"
      stroke="#96b293"
      stroke-width="1.5"
    />

    <!-- Central Shield: Upper Main Facet (#829F80) -->
    <path
      d="M 65 18 L 106 36 L 98 72 L 65 83 L 32 72 L 24 36 Z"
      fill="url(#di-facet-top-full)"
      stroke="#738f71"
      stroke-width="1.5"
    />

    <!-- Front Segment of Upper Orbital Ring -->
    <path
      d="M 24 44 C 30 52 50 56 65 56 C 80 56 100 52 106 44 C 114 34 94 28 65 28 C 36 28 16 34 24 44 Z"
      stroke="#adc4ab"
      stroke-width="5.5"
      fill="none"
    />

    <!-- Front Segment of Lower Orbital Ring -->
    <path
      d="M 24 64 C 30 72 50 76 65 76 C 80 76 100 72 106 64 C 114 54 94 48 65 48 C 36 48 16 54 24 64 Z"
      stroke="#adc4ab"
      stroke-width="5.5"
      fill="none"
    />

    <!-- Bold Letter D -->
    <text
      x="65"
      y="60"
      text-anchor="middle"
      dominant-baseline="central"
      fill="#ffffff"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Black', sans-serif"
      font-weight="900"
      font-size="36"
      letter-spacing="0.5"
      filter="url(#di-shadow-full)"
    >
      D
    </text>
  </g>

  <!-- Typography Below Emblem -->
  <!-- "DATAICON" in #829F80 -->
  <text
    x="120"
    y="160"
    text-anchor="middle"
    fill="#829F80"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif"
    font-weight="800"
    font-size="30"
    letter-spacing="1.5"
  >
    DATAICON
  </text>

  <!-- "SINCE 2026" with Tracking in #829F80 -->
  <text
    x="120"
    y="190"
    text-anchor="middle"
    fill="#829F80"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="700"
    font-size="13"
    letter-spacing="7"
    opacity="0.9"
  >
    SINCE 2026
  </text>
</svg>
