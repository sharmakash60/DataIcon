[project]
name = "datapilot-agent"
version = "0.1.0"
description = "DataPilot Client Data Agent - Local Execution Runtime"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pandas>=2.2.0",
  "pyarrow>=15.0.0",
  "openpyxl>=3.1.0",
  "pydantic>=2.10.0",
  "httpx>=0.28.0",
  "scikit-learn>=1.4.0",
  "optuna>=3.6.0",
  "xgboost>=2.0.0",
  "lightgbm>=4.3.0",
  "catboost>=1.2.0",
  "fastapi>=0.141.1",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapilot_agent"]
